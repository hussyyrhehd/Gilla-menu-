name: Build GILLA Mod
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C# to DLL
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $csFiles = Get-ChildItem -Filter *.cs | ForEach-Object { $_.Name }
          $refs = Get-ChildItem -Filter *.dll | ForEach-Object { "/reference:$($_.Name)" }
          & $csc /target:library /out:GillaModMenu.dll $refs $csFiles

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: GillaModMenu-Compiled
          path: GillaModMenu.dll
