name: Build Mod DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile DLL
      run: |
        csc /target:library /out:GillaModMenu.dll GillaModMenu.cs /reference:UnityEngine.dll /reference:OVRInput.dll

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: GillaModMenu-compiled
        path: GillaModMenu.dll
